name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes app.py dispatcher.py planner.py motion.py gdioverlay.py overlay.py gamecam.py locate.py gwmem.py tools dev
      - run: python -c "import sys; sys.path.insert(0, 'savelib'); import dispatcher, planner, motion, locate, overlay, gamecam; print(dispatcher.VERSION)"
